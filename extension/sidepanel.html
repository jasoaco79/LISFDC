<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LISFDC</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>LISFDC <span class="ver">v1</span></h1>
      <p class="tag">scrape-only · visible fields from open tabs</p>
    </div>
  </header>

  <main class="cols">
    <section class="col li" aria-label="LinkedIn">
      <h2>LinkedIn</h2>
      <div class="actions">
        <button type="button" id="btn-read-li">Scrape LinkedIn</button>
        <label class="url-label" for="li-url">Open in existing LinkedIn tab</label>
        <input id="li-url" type="url" spellcheck="false" placeholder="https://www.linkedin.com/in/…" />
        <button type="button" id="btn-open-li" class="secondary">Open in existing LinkedIn tab</button>
      </div>
      <p id="li-status" class="status" role="status"></p>
      <pre id="li-json" class="json">No LinkedIn extract yet.</pre>
    </section>

    <section class="col sf" aria-label="Salesforce">
      <h2>Salesforce</h2>
      <div class="actions">
        <button type="button" id="btn-read-sf">Scrape Salesforce</button>
      </div>
      <p id="sf-status" class="status" role="status"></p>
      <pre id="sf-json" class="json">No Salesforce extract yet.</pre>
    </section>
  </main>

  <footer class="foot">
    v1 never writes to LinkedIn or Salesforce. Visible fields only. No API.
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
