<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jane Example | LinkedIn</title>
    <meta property="og:title" content="Jane Example" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jane Example",
        "jobTitle": "VP Sales",
        "worksFor": { "@type": "Organization", "name": "Northwind" },
        "address": { "@type": "PostalAddress", "addressLocality": "Austin, Texas" }
      }
    </script>
  </head>
  <body>
    <main class="scaffold-layout__main">
      <section class="pv-text-details__left-panel ph5">
        <h1 class="text-heading-xlarge inline t-24">Jane Example</h1>
        <div class="text-body-medium break-words" data-anonymize="headline">VP Sales at Northwind</div>
        <span class="text-body-small inline t-black--light break-words" data-anonymize="location"
          >Austin, Texas, United States</span
        >
      </section>
      <section id="experience">
        <h2>Experience</h2>
        <ul>
          <li class="pvs-list__paged-list-item">
            <span class="t-bold"><span aria-hidden="true">Vice President of Sales</span></span>
            <span class="t-14 t-normal"><span aria-hidden="true">Northwind</span></span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
